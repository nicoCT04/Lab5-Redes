<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D5B"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A65E1F"/></marker>
  </defs>
  <style>.c text{paint-order:stroke;stroke:#FFFFFF;stroke-width:6px;stroke-linejoin:round}</style>
  <rect width="1600" height="900" fill="#FFF"/>

  <!-- Participantes -->
  <g font-size="19" font-weight="bold" fill="#FFF" text-anchor="middle">
    <rect x="50" y="30" width="250" height="70" rx="8" fill="#1F3A5F"/>
    <text x="175" y="60">Equipo host</text><text x="175" y="86" font-size="15" font-weight="normal">navegador + archivo hosts</text>
    <rect x="420" y="30" width="300" height="70" rx="8" fill="#2E7D5B"/>
    <text x="570" y="60">lab5-web</text><text x="570" y="86" font-size="15" font-weight="normal">certbot + hooks DuckDNS</text>
    <rect x="850" y="30" width="300" height="70" rx="8" fill="#A65E1F"/>
    <text x="1000" y="60">DuckDNS</text><text x="1000" y="86" font-size="15" font-weight="normal">DNS público del dominio</text>
    <rect x="1280" y="30" width="270" height="70" rx="8" fill="#444"/>
    <text x="1415" y="60">Let's Encrypt</text><text x="1415" y="86" font-size="15" font-weight="normal">servidor ACME</text>
  </g>
  <g stroke="#9AA4B2" stroke-width="2" stroke-dasharray="6 6">
    <line x1="175" y1="100" x2="175" y2="860"/><line x1="570" y1="100" x2="570" y2="860"/>
    <line x1="1000" y1="100" x2="1000" y2="860"/><line x1="1415" y1="100" x2="1415" y2="860"/>
  </g>

  <g class="c" font-size="16" fill="#222">
    <!-- 1 -->
    <line x1="572" y1="150" x2="1411" y2="150" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="600" y="140"><tspan font-weight="bold">1.</tspan> Solicita certificado para redes-lab5-wp.duckdns.org (reto dns-01)</text>
    <!-- 2 -->
    <line x1="1413" y1="210" x2="574" y2="210" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="600" y="200"><tspan font-weight="bold">2.</tspan> Entrega el valor del reto (token derivado de la llave de la cuenta)</text>
    <!-- 3 -->
    <line x1="572" y1="280" x2="996" y2="280" stroke="#A65E1F" stroke-width="2.5" marker-end="url(#n)"/>
    <text x="600" y="258"><tspan font-weight="bold">3.</tspan> auth-hook: API HTTPS con token</text>
    <text x="600" y="272" font-size="14" fill="#555">TXT _acme-challenge = valor</text>
    <rect x="1010" y="262" width="250" height="34" rx="5" fill="#FBF3EA" stroke="#A65E1F"/>
    <text x="1135" y="285" text-anchor="middle" font-size="15">registro TXT publicado</text>
    <!-- 4 -->
    <rect x="440" y="320" width="260" height="40" rx="5" fill="#EEF5F1" stroke="#2E7D5B"/>
    <text x="570" y="346" text-anchor="middle" font-size="15"><tspan font-weight="bold">4.</tspan> espera 60 s (propagación)</text>
    <!-- 5 -->
    <line x1="1413" y1="410" x2="1004" y2="410" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="1030" y="400"><tspan font-weight="bold">5.</tspan> Consulta el TXT en el DNS público</text>
    <line x1="1002" y1="450" x2="1411" y2="450" stroke="#A65E1F" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#n)"/>
    <text x="1030" y="440" font-size="15" fill="#A65E1F">valor coincide → control demostrado</text>
    <!-- 6 -->
    <line x1="1413" y1="520" x2="574" y2="520" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#v)"/>
    <text x="600" y="510"><tspan font-weight="bold">6.</tspan> Emite el certificado (CN = redes-lab5-wp.duckdns.org, emisor Let&apos;s Encrypt)</text>
    <!-- 7 -->
    <line x1="572" y1="580" x2="996" y2="580" stroke="#A65E1F" stroke-width="2.5" marker-end="url(#n)"/>
    <text x="600" y="570"><tspan font-weight="bold">7.</tspan> cleanup-hook: borra el TXT</text>
    <rect x="440" y="610" width="260" height="40" rx="5" fill="#EEF5F1" stroke="#2E7D5B"/>
    <text x="570" y="636" text-anchor="middle" font-size="15">Nginx carga fullchain + privkey</text>

    <!-- 8 -->
    <rect x="40" y="690" width="270" height="56" rx="5" fill="#F4F6F9" stroke="#1F3A5F"/>
    <text x="175" y="713" text-anchor="middle" font-size="15"><tspan font-weight="bold">8.</tspan> hosts: el nombre resuelve</text>
    <text x="175" y="734" text-anchor="middle" font-size="15">a 192.168.56.10 (no a Internet)</text>
    <line x1="177" y1="790" x2="566" y2="790" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="200" y="780"><tspan font-weight="bold">9.</tspan> HTTPS 443 · SNI redes-lab5-wp…</text>
    <line x1="568" y1="830" x2="179" y2="830" stroke="#2E7D5B" stroke-width="2.5" marker-end="url(#v)"/>
    <text x="200" y="855" font-size="15" fill="#2E7D5B">certificado válido: coincide el nombre y la cadena llega a ISRG Root X1</text>
  </g>
  <text x="1580" y="885" text-anchor="end" font-size="14" fill="#666" font-style="italic">Let's Encrypt nunca se conecta a la VM: solo consulta el DNS público.</text>
</svg>
