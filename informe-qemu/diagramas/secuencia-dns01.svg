<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Liberation Sans, Arial, sans-serif" fill="#1E2933">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#2F3B4C"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2F3B4C" stroke-width="1.4"/></marker>
  </defs>
  <style>.m{font-size:14px}.n{font-size:13px;fill:#55606B}.c text{paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}</style>
  <rect width="1400" height="640" fill="#FFFFFF"/>

  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="70" y="30" width="200" height="50" fill="#F5F7F9" stroke="#2F3B4C" stroke-width="1.5"/><text x="170" y="61">Cliente</text>
    <rect x="420" y="30" width="200" height="50" fill="#F5F7F9" stroke="#2F3B4C" stroke-width="1.5"/><text x="520" y="61">lab5-web (certbot)</text>
    <rect x="770" y="30" width="200" height="50" fill="#F5F7F9" stroke="#2F3B4C" stroke-width="1.5"/><text x="870" y="61">DuckDNS</text>
    <rect x="1120" y="30" width="200" height="50" fill="#F5F7F9" stroke="#2F3B4C" stroke-width="1.5"/><text x="1220" y="61">Let's Encrypt</text>
  </g>
  <g stroke="#9AA4AE" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="170" y1="80" x2="170" y2="610"/><line x1="520" y1="80" x2="520" y2="610"/>
    <line x1="870" y1="80" x2="870" y2="610"/><line x1="1220" y1="80" x2="1220" y2="610"/>
  </g>

  <g class="c" stroke-width="1.4">
    <line x1="520" y1="130" x2="1216" y2="130" stroke="#2F3B4C" marker-end="url(#s)"/>
    <text x="540" y="121" class="m">1. Pedido de certificado, reto dns-01</text>
    <line x1="1220" y1="180" x2="524" y2="180" stroke="#2F3B4C" stroke-dasharray="6 4" marker-end="url(#r)"/>
    <text x="540" y="171" class="m">2. Valor del reto</text>
    <line x1="520" y1="235" x2="866" y2="235" stroke="#2F3B4C" marker-end="url(#s)"/>
    <text x="540" y="226" class="m">3. API: TXT _acme-challenge</text>
    <line x1="1220" y1="295" x2="874" y2="295" stroke="#2F3B4C" marker-end="url(#s)"/>
    <text x="890" y="286" class="m">4. Consulta DNS del TXT</text>
    <line x1="870" y1="335" x2="1216" y2="335" stroke="#2F3B4C" stroke-dasharray="6 4" marker-end="url(#r)"/>
    <text x="890" y="326" class="n">valor del TXT</text>
    <line x1="1220" y1="390" x2="524" y2="390" stroke="#2F3B4C" stroke-dasharray="6 4" marker-end="url(#r)"/>
    <text x="540" y="381" class="m">5. Certificado emitido</text>
    <line x1="520" y1="440" x2="866" y2="440" stroke="#2F3B4C" marker-end="url(#s)"/>
    <text x="540" y="431" class="m">6. API: borra el TXT</text>
    <line x1="170" y1="525" x2="516" y2="525" stroke="#2F3B4C" marker-end="url(#s)"/>
    <text x="190" y="505" class="m">7. HTTPS a 192.168.56.10</text>
    <text x="190" y="545" class="n">(resuelto por el archivo hosts)</text>
    <line x1="520" y1="585" x2="174" y2="585" stroke="#2F3B4C" stroke-dasharray="6 4" marker-end="url(#r)"/>
    <text x="190" y="576" class="m">8. Certificado válido para el nombre</text>
  </g>
</svg>
